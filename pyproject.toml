[project]
name = "horosa-public"
version = "0.1.5"
description = "Horosa 星阙 public MCP for the ChatGPT / Codex plugin directory: anonymous, read-only, stateless. Wraps the released horosa-skill without modifying it."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  # Pinned release wheel of Horosa Skill (never a source checkout). uv.lock records its sha256;
  # tests/test_dependency_pin.py keeps it equal to the release SHA256SUMS.txt.
  "horosa-skill @ https://github.com/Horace-Maxwell/horosa-skill/releases/download/v0.47.1/horosa_skill-0.47.1-py3-none-any.whl",
  "jsonschema>=4.20.0",
  # Same SDK line the skill's own lock resolves to; PublicFastMCP touches MCPServer 2.3 internals.
  "mcp[cli]==2.3.0",
  "starlette>=0.40.0",
  "uvicorn>=0.31.0",
]

[project.scripts]
horosa-public = "horosa_public.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horosa_public"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[tool.hatch.metadata]
# The horosa-skill dependency is a pinned release-wheel URL (a direct reference).
allow-direct-references = true
